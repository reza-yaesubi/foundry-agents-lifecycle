# =============================================================================
# azure.yaml — Azure Developer CLI (azd) project configuration
# =============================================================================
#
# HOW THIS FILE WORKS:
#   azd reads this file to understand your project structure.
#   When you run `azd up`, it:
#     1. Provisions infrastructure defined in infra/ (Bicep) — the Foundry
#        account/project, model deployments, and Key Vault.
#     2. Runs the postprovision hook, which deploys the agent to Foundry via
#        src/scripts/deploy_agent.py (the same script CI/CD uses).
#
# WHY THIS MATTERS FOR CI/CD:
#   This file is the declarative "what I want deployed" definition.
#   Same file, different environment variables → different environments.
#
# =============================================================================

name: foundry-agents-lifecycle
metadata:
  template: foundry-agents-lifecycle-demo

# ---------------------------------------------------------------------------
# Infrastructure — points to Bicep templates
# ---------------------------------------------------------------------------
infra:
  provider: bicep
  path: infra
  module: main

# ---------------------------------------------------------------------------
# Agent deployment — handled by the repo's own SDK script
# ---------------------------------------------------------------------------
# This project creates a *prompt agent* (name + model + instructions + tools)
# via src/scripts/deploy_agent.py, driven by config/agent-config.{env}.json.
# That same script is used by the Azure DevOps pipeline, so `azd up` reuses it
# instead of duplicating the agent definition.
#
# `azd up` therefore runs: provision Bicep infra → deploy the agent.
# The AZURE_AI_PROJECT_ENDPOINT Bicep output is injected automatically.
# ---------------------------------------------------------------------------
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: .venv/bin/python src/scripts/deploy_agent.py --env "$AZURE_ENV_NAME"
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: .venv/Scripts/python.exe src/scripts/deploy_agent.py --env $env:AZURE_ENV_NAME

# ---------------------------------------------------------------------------
# Model Deployments
# ---------------------------------------------------------------------------
# These models are deployed to your Foundry project.
# Different environments can use different models or capacities.
#
# In dev:  Use gpt-4.1-mini (cheaper, faster iteration)
# In prod: Use gpt-4o (better quality, higher capacity)
# ---------------------------------------------------------------------------
ai:
  models:
    - name: gpt-4.1-mini
      version: "2025-04-14"
      sku:
        name: GlobalStandard
        capacity: 10    # Tokens per minute (in thousands)
    - name: gpt-4o
      version: "2024-11-20"
      sku:
        name: GlobalStandard
        capacity: 30
